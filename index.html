
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Disponibilidad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }
        #sidebar {
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        #header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div id="header" class="p-3">
        <h2 class="mb-0">Panel de Monitorización</h2>
        <small class="text-muted">Resumen global (Fase 2 lo rellenará)</small>
    </div>

    <div class="container-fluid">
        <div class="row">

            <nav id="sidebar" class="col-3 p-3">
                <h5>Sitios monitorizados</h5>
                <div class="list-group" id="site-list">
                    <a href="#" class="list-group-item list-group-item-action disabled">
                        (Aquí aparecerán las webs)
                    </a>
                </div>
            </nav>

            <main class="col-9 p-4">
                <h4>Selecciona un sitio para ver sus métricas</h4>
                <p class="text-muted">En la Fase 3 y 4 se rellenará esta sección.</p>
            </main>

        </div>
    </div>

</body>
</html>
