name: Actualizar métricas

on:
  # schedule:
  #   - cron: "* * * * *" # Cada minuto
  workflow_dispatch:
    

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upload DB artifact
        uses: actions/upload-artifact@v3
        with:
          name: monitor-db
          path: ./monitor.db

      # - name: Download DB artifact
